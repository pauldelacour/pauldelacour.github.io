title: "Paul-Louis Delacour"
description: "Machine learning, high-dimensional statistics, and random matrix theory"
url: "https://pauldelacour.github.io"
baseurl: ""  
repository: "pauldelacour/pauldelacour.github.io"  # Change when switching back to original
lang: en
markdown: kramdown
permalink: pretty

email: "delacourpaullouis@gmail.com"
github_username: "pauldelacour"
location: "TU Delft"
avatar: "/images/photo_cv.jpg"

# Jekyll ignores underscore-prefixed page folders unless explicitly included.
include:
  - _pages

collections:
  talks:
    output: true
    permalink: /talks/:name/
  # Optional enrichments of Jekyll-Scholar's automatically generated detail pages.
  # These documents are read by the paper layout, NOT published as separate pages.
  paper_content:
    output: false

plugins:
  - jekyll/scholar

scholar:
  source: "./_bibliography"
  bibliography: "papers.bib"
  bibliography_template: bib
  details_layout: paper.html
  details_dir: publication
  details_permalink: "/publication/:key/"
  details_link: false
  query: "@*"
  sort_by: year
  order: descending
  group_by: none
  style: apa
  locale: en
  replace_strings: true
  join_strings: true
  bibtex_filters: [latex]

exclude:
  - README.md
  - DEPLOY.md
  - MIGRATION.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - examples/
  - vendor/
  - .github/
  - .gitignore
  - LICENSE
