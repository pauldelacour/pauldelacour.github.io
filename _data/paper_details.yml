delacour2025smm:
  description: >-
    We introduce the spiked mixture model (SMM) to address the problem of estimating
    a set of signals from many randomly scaled and noisy observations. Subsequently,
    we design a novel expectation-maximization (EM) algorithm to recover all parameters
    of the SMM. Numerical experiments show that in low signal-to-noise ratio regimes,
    and for data types where the SMM is relevant, SMM surpasses the more traditional
    Gaussian mixture model (GMM) in terms of signal recovery performance.
  video_title: Model illustration
  video: /images/SMM/synthetic_data_SMM.mp4
  figures_title: Numerical results
  figures:
    - src: /images/SMM/model_comparison_low_noise_0.01.png
      caption: 'Low noise: \(\sigma^2 = 0.01\)'
      alt: Model comparison for a low-noise signal recovery experiment
    - src: /images/SMM/model_comparison_high_noise_0.5.png
      caption: 'High noise: \(\sigma^2 = 0.5\)'
      alt: Model comparison for a high-noise signal recovery experiment

delacour2026sisal:
  description: >-
    As datasets grow increasingly high-dimensional and complex, distinguishing a
    condensed set of interpretable underlying factors becomes essential. We propose
    a new approach based on the beta-variational autoencoder and kernel density
    estimation to dissect data along independent, uncertainty-aware, and interpretable
    (yet non-linear) latent axes. A comparative-latent-traversal algorithm translates
    latent findings back into the original measurement context. Applied to imaging
    mass spectrometry of human kidney, the approach separates signal strength from
    relative signal content and reveals previously unrecognized subdivisions within
    kidney proximal tubules.
  figures_title: Illustration on synthetic data
  figures_layout: grid
  figures:
    - src: /images/SiSAL/synthetic_dataset.png
      caption: 'Synthetic dataset generation, \(\{x_i\}_{i\in I}\)'
      alt: Schematic of the synthetic dataset generation process
      wide: true
    - src: /images/SiSAL/synthetic_latent.png
      caption: Latent representation colored by tissue structure membership
      alt: Tissue structure labels visualized in the learned latent space
    - src: /images/SiSAL/synthetic_SNR_latent.png
      caption: 'Latent representation colored by \(\mathrm{SNR}_i\)'
      alt: Signal-to-noise ratios visualized in the learned latent space

delacour2026phase:
  description: >-
    The spiked mixture model (SMM) generalizes the single-spike Wishart model to a
    mixture model. We prove that extreme eigenvalues of its covariance matrix
    exhibit a phase transition in high-dimensional regimes. The transition depends
    on the correlations between spikes, their strengths, and the mixture
    probabilities. These results yield quantitative signal-detection thresholds
    from the extreme eigenvalues of the sample covariance matrix.
  figures_title: Spectral phase transition
  figures:
    - src: /images/Phase_transition/SMM-empirical-eigval.png
      caption: Example of two eigenvalues escaping the Marchenko–Pastur bulk
      alt: Empirical eigenvalue histogram with two spiked outliers
    - src: /images/Phase_transition/SMM-parameter-change.png
      caption: Effect of changing spike strengths, correlation, and mixture probabilities
      alt: Eigenvalue response to the parameters of the spiked mixture model
